name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    name: structure, accuracy and boundary checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Legal headers
        run: python3 scripts/check_legal_headers.py
      - name: Environment validator
        run: python3 scripts/validate_env.py
      - name: Hook scripts (syntax)
        run: for f in claude/hooks/*.sh; do bash -n "$f"; done
      - name: Hook scripts (behaviour)
        run: bash scripts/test_hooks.sh
      - name: Seed simulation (profiles)
        run: python3 scripts/simulate_seed.py

  plugin:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace + plugin manifests
        run: |
          claude plugin validate ./.claude-plugin/marketplace.json --strict
          claude plugin validate ./.claude-plugin/plugin.json --strict
      - name: Validate skills and agents
        run: |
          claude plugin validate ./claude/skills --strict
          claude plugin validate ./claude/agents --strict
